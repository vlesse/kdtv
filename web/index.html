<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KDTV</title>

    <style>
      /*
        The boot screen, inline so it needs nothing loaded to appear.

        A set-top box takes a second or two to get from launch to a running
        app, and everything that fills that second has to already be in this
        file - a stylesheet or a script would each add a round trip to the very
        gap being covered. So this is inline, and deliberately small.
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06121e;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background:
          linear-gradient(180deg, rgba(4, 14, 26, 0.55), rgba(3, 10, 20, 0.85)),
          var(--splash-photo, none),
          linear-gradient(160deg, #0a3f68 0%, #10618f 45%, #062f4c 100%);
        background-size: cover;
        background-position: center;
        transition: opacity 0.45s ease;
      }

      #splash[data-done='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #splash-logo {
        max-width: min(38vw, 420px);
        max-height: 22vh;
        object-fit: contain;
      }

      #splash-name {
        color: #fff;
        font: 600 clamp(1.1rem, 2.4vw, 2.2rem) / 1.3 system-ui, sans-serif;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }

      /* Three dots rather than a ring: a spinner on a dark TV panel reads as a
         fault light, a pulse reads as progress. */
      #splash-dots {
        display: flex;
        gap: 0.55rem;
      }

      #splash-dots i {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        animation: splash-pulse 1.2s ease-in-out infinite;
      }

      #splash-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }
      #splash-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes splash-pulse {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        35% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!--
      The operator's theme, generated by the BFF from what the console holds.

      Two things about where this sits. It is a <link> rather than a script
      injection so it arrives with the rest of the CSS instead of after first
      paint - a theme applied late is a visible flash of the defaults on every
      boot. And it is the first thing in <body> rather than in <head> because
      the bundler appends the app's own stylesheet to the end of <head>: a
      theme that loaded before it would lose every tie in the cascade, which
      is exactly the opposite of what an override is for. Still fully
      render-blocking here, so nothing paints before it lands.
    -->
    <script>
      /*
       * 主题样式表现在是**按酒店**的，而一个 <link> 带不上 X-Device-Id。
       *
       * 所以把盒子的 id 挂在查询串上。取 id 用的是壳里那个同步桥 ——
       * 它在第一次加载之前就注册好了（见 MainActivity 的注释），所以这里
       * 拿得到，不用等任何异步。取不到就退回不带参数的地址，服务端会给
       * 一份中性的默认主题，而不是某一家酒店的颜色。
       *
       * 仍然是在这个位置写出 <link>，仍然阻塞渲染 —— 晚到的主题在每次
       * 开机时都是一次可见的闪色。
       */
      (function () {
        var id = '';
        try {
          id = (window.WeWatchShell && window.WeWatchShell.deviceId()) || '';
        } catch (e) {
          /* 桥在但不高兴，当作没有 */
        }
        if (!id) {
          try {
            id = window.__DEVICE_ID__ || localStorage.getItem('ott.deviceId') || '';
          } catch (e) {
            /* 存储不可用 */
          }
        }
        document.write(
          '<link rel="stylesheet" href="/theme.css' +
            (id ? '?d=' + encodeURIComponent(id) : '') +
            '">',
        );
      })();
    </script>

    <div id="splash">
      <img id="splash-logo" alt="" hidden />
      <div id="splash-name">KDTV</div>
      <div id="splash-dots"><i></i><i></i><i></i></div>
    </div>

    <script>
      /*
        Dress the boot screen from what the last boot remembered.

        The splash image lives on the server, so the first launch after a
        change still shows the gradient - fetching it here would put a network
        round trip inside the very gap this screen exists to cover. Every
        launch after that is instant, which is the one that matters: a box in a
        room reboots far more often than its branding changes.
      */
      try {
        var cached = JSON.parse(localStorage.getItem('wewatch.splash') || '{}');
        var splash = document.getElementById('splash');
        if (cached.photo) splash.style.setProperty('--splash-photo', 'url("' + cached.photo + '")');
        if (cached.name) document.getElementById('splash-name').textContent = cached.name;
        if (cached.logo) {
          var logo = document.getElementById('splash-logo');
          logo.src = cached.logo;
          logo.hidden = false;
        }
      } catch (e) {
        /* private mode, cleared storage - the gradient is a fine fallback */
      }
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
